[package]
name = "allowit-odc"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-recipient-policy = []
test-xlm-policy = []

[dependencies]
soroban-sdk = { workspace = true }
allowit-wallet-protocol = { path = "../protocol" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

ed25519-dalek = "=2.2.0"
