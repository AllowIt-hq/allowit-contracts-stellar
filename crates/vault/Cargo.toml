[package]
name = "allowit-vault"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
build = "../../policy/build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["stellar"]
stellar = []

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
allowit-policy = { path = "../policy" }
soroban-sdk = { workspace = true, features = ["testutils"] }

[build-dependencies]
sha2 = "=0.10.9"
