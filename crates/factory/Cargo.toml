[package]
name = "allowit-factory"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["stellar"]
stellar = []

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

allowit-vault = { path = "../vault" }
allowit-policy = { path = "../policy" }
