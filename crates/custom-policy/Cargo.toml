[package]
name = "allowit-custom-policy"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
allowit-wallet-protocol = { path = "../protocol" }
allowit = { path = "../allowit" }
allowit-policy-wallet = { path = "../policy-wallet" }

[build-dependencies]
sha2 = "=0.10.9"

[dev-dependencies]
# The host backend proves the authored source is portable.
allowit = { path = "../allowit", features = ["dual"] }
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "=2.2.0"
