[package]
name = "allowit-custom-policy"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
allowit-wallet-protocol = { path = "../protocol" }
allowit-policy-rules = { path = "../rules" }
allowit-policy-wallet = { path = "../policy-wallet" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "=2.2.0"
