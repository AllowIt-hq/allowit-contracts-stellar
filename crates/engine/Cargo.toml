[package]
name = "allowit-wallet-engine"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-deny = []

[dependencies]
soroban-sdk.workspace = true
allowit = { path = "../allowit" }

[dev-dependencies]
allowit-wallet-protocol = { path = "../protocol" }
soroban-sdk = { workspace = true, features = ["testutils"] }
