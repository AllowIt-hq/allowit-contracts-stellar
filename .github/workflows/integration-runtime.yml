name: Stellar runtime smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full integration regression suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stellar-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: >-
      !((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && (github.triggering_actor || github.actor) == 'agentool' && !(github.event_name == 'push' && github.ref == 'refs/heads/prod'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check shared policy identity and formatting
        run: |
          python3 scripts/check-policy.py
          cargo fmt --all --check
      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar.tar.gz
          echo 'c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  /tmp/stellar.tar.gz' | sha256sum -c -
          mkdir /tmp/stellar-cli
          tar -xzf /tmp/stellar.tar.gz -C /tmp/stellar-cli
          echo /tmp/stellar-cli >> "$GITHUB_PATH"
          rustup target add wasm32v1-none --toolchain 1.98.0
      - name: Build all contract Wasm
        run: stellar contract build
      - name: Smoke compiled policy and token custody
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p allowit-vault tests::custody_transfer_daily_boundary_and_atomic_denial -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F "1 passed; 0 failed" "$RUNNER_TEMP/smoke.log"
      - name: Smoke compiled vault factory
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p allowit-factory tests::factory_creates_compiled_vaults_with_owner_bound_salts -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F "1 passed; 0 failed" "$RUNNER_TEMP/smoke.log"
      - name: Full Stellar runtime regressions
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: cargo test --workspace --locked
