[workspace]
members = ["crates/protocol", "crates/rules", "crates/engine", "crates/engine-parent", "crates/policy-wallet", "crates/simple-policy-engine", "crates/common-policy-engine", "crates/custom-policy"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
debug = 0
