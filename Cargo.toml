[workspace]
members = ["crates/policy", "crates/vault", "crates/factory", "crates/protocol", "crates/engine", "crates/engine-parent", "crates/odc"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "=28.0.0", features = ["hazmat-address"] }

[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
debug = 0
